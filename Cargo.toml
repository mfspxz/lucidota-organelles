[workspace]
members = [
    "crates/organelle-manifest",
    "crates/organelle-host",
    "crates/organelle-typed",
    "crates/ref-common",
    "crates/ref-typed-hash",
    "crates/ref-typed-commit",
    "crates/ref-kv-store",
    "crates/ref-http-fetch",
    "crates/ref-text-transform",
    "crates/ref-json-validate",
    "crates/ref-hash-seal",
    "crates/ref-time-oracle",
    "crates/ref-entropy-source",
    "crates/ref-https-transport",
    "crates/ref-cf-storage",
    "crates/ref-credential-broker",
    "crates/ref-policy-gate",
    "crates/ref-lease-queue",
    "crates/ref-edge-worker-shell",
    "crates/ref-breaker-quota",
    "crates/ref-graph-store",
    "crates/ref-replay-registry",
    "crates/ref-model-call-live",
    "crates/ref-gtfs-rt-decode",
    "crates/ref-code-graph-parse",
    "crates/ref-payout-split",
    "crates/ref-mem0-client",
    "crates/ref-geo-point",
    "crates/ref-ledger-append",
    "crates/ref-notify",
    "crates/ref-scrape-extract",
    "crates/ref-model-call",
    "crates/ref-file-cas",
    "crates/surface-unix",
    "crates/surface-mcp",
    "crates/surface-rest",
    "crates/organelle-equivalence",
    "crates/claim-reconciler",
    "crates/ref-template-engine",
    "crates/ref-ontology-terms",
    "crates/ref-verified-context",
    "crates/ref-epistemic-gate",
    "crates/ref-keystore",
    "crates/ref-contracts-vm",
    "crates/ref-evidence-gate",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
organelle-manifest = { path = "crates/organelle-manifest" }
organelle-host = { path = "crates/organelle-host" }
organelle-typed = { path = "crates/organelle-typed" }
ref-common = { path = "crates/ref-common" }
