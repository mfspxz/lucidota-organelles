[workspace]
members = [
    "crates/organelle-manifest",
    "crates/organelle-host",
    "crates/ref-common",
    "crates/ref-kv-store",
    "crates/ref-http-fetch",
    "crates/ref-text-transform",
    "crates/ref-json-validate",
    "crates/ref-hash-seal",
    "crates/ref-time-oracle",
    "crates/ref-geo-point",
    "crates/ref-ledger-append",
    "crates/ref-notify",
    "crates/ref-scrape-extract",
    "crates/ref-model-call",
    "crates/ref-file-cas",
    "crates/surface-unix",
    "crates/surface-mcp",
    "crates/surface-rest",
    "crates/organelle-equivalence",
    "crates/claim-reconciler",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
organelle-manifest = { path = "crates/organelle-manifest" }
organelle-host = { path = "crates/organelle-host" }
ref-common = { path = "crates/ref-common" }
