[package]
name = "ref-edge-worker-shell"
version = "1.0.0"
edition = "2021"

[features]
default = ["organelle"]
# The Organelle trait surface.  Consumers that only want the shell
# API turn this off (default-features = false) so no host/manifest
# deps enter their graph — the same discipline as
# ref-entropy-source through ref-lease-queue.
organelle = ["dep:organelle-manifest", "dep:organelle-host"]
# The workers-rs runtime glue (fetch / scheduled dispatch against
# the real Workers `Request` / `Env` / `ScheduledEvent` types).
# All of its dependencies are target-gated to wasm32 below, so the
# feature is a no-op switch on native targets — the glue module
# itself is cfg-gated out there too.  The core (router, gate,
# envelopes, env trait) never depends on it.
workers = ["dep:worker"]

[dependencies]
organelle-manifest = { workspace = true, optional = true }
organelle-host = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The streaming response body (ShellResponse::stream): a bare
# Stream trait object, nothing more.
futures-core = "0.3"
# Binding access composes over ref-cf-storage (org-027):
# Ctx hands handlers its wasm_bindings::CfBindings accessors.
# default-features = false: this crate defines its own organelle
# surface and needs neither the storage crate's surface nor its
# native REST client.
ref-cf-storage = { path = "../ref-cf-storage", default-features = false }

# Workers runtime glue: workers-rs, the same major line the
# Exchange's production worker (the proven instance of this
# pattern) builds on.  Target-gated so native builds and native
# tests never see the tree.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
worker = { version = "0.8", optional = true }
# Non-optional on wasm32 (the ref-cf-storage pattern): the core's
# ShellEnv::raw_env names JsValue on that target whether or not
# the workers-rs glue is enabled.
wasm-bindgen = "0.2"
js-sys = "0.3"
